name: Live Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: event_ticketing_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli

      - name: Wait for MySQL and load schema
        run: |
          for i in {1..10}; do mysqladmin ping -h 127.0.0.1 -u root -proot --silent && break; sleep 3; done
          mysql -h 127.0.0.1 -u root -proot event_ticketing_db < schema.sql

      - name: Start website and tunnel
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: event_ticketing_db
        run: |
          php -S 0.0.0.0:8000 &
          sleep 2
          curl -Lo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:8000 &
          echo "=================================================="
          echo "网站正在启动中，网址会显示在下面几秒后的 log 里"
          echo "=================================================="
          sleep 20
          echo "如果上面还没看到网址，往上滚动找 trycloudflare.com 那一行"
          sleep 1200
