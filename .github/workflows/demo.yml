name: Live Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: event_ticketing_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli

      - name: Load database schema
        run: |
          for i in {1..10}; do mysqladmin ping -h 127.0.0.1 -u root -proot --silent && break; sleep 3; done
          mysql -h 127.0.0.1 -u root -proot event_ticketing_db < schema.sql

            - name: Start website
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: event_ticketing_db

          composer install --no-interaction --no-dev || true
          nohup php -S 0.0.0.0:8000 > php.log 2>&1 &
          sleep 3
          curl -s http://localhost:8000/ -o /dev/null -w "HTTP status: %{http_code}\n"
          echo "===== php.log ====="
          cat php.log

      - name: Download cloudflared
        run: |
          curl -Lo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Start tunnel and show URL
        run: |
          ./cloudflared tunnel --url http://localhost:8000 > tunnel.log 2>&1 &
          echo "等待网址生成中..."
          for i in {1..30}; do
            if grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' tunnel.log; then
              break
            fi
            sleep 2
          done
          echo "=================================================="
          echo "上面这行 https://xxxx.trycloudflare.com 就是你的网站网址"
          echo "=================================================="
          sleep 1200
